name: Docker Build & Test 🐳

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - "**"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository 📦
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: build/Dockerfile
          # `cpu` so that the CI does not need to download the (much bigger) CUDA wheels
          build-args: |
            TORCH_EXTRA=cpu
          push: false
          load: true
          tags: lightning-base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - the image must be able to run the training script
        run: |
          docker run --rm lightning-base:latest uv run --no-sync src/train.py debug=fdr
