name: Deploy Docs 📔
on:
  # Only deploy from the default branches: a pull request (especially from dependabot/forks) has a
  # read-only GITHUB_TOKEN, so `mkdocs gh-deploy` can only fail there - and it must never push
  # unreviewed documentation to gh-pages.
  push:
    branches:
      - master
      - main
permissions:
  contents: write
# never let two deploys race on the gh-pages branch
concurrency:
  group: deploy-docs
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra docs

      # `--no-sync` so the docs extra is not dropped by an implicit sync
      - run: uv run --no-sync mkdocs gh-deploy --force -f docs/mkdocs.yml
