name: Unit Testing 🧪

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # the configs resolve ${oc.env:PROJECT_ROOT} for all the project paths
      PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout your repo 📦
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # NB: do NOT pin an old version here: this project uses `[tool.uv] conflicts` and
          # per-extra `[tool.uv.sources]`, which uv < 0.5 cannot even parse.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync project dependencies
        run: uv sync --locked --extra cpu --extra test

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Smoke test - train and evaluate on CPU
        # This is what actually proves the template works: it resolves the hydra configs,
        # instantiates the datamodule/model (torchvision import, torchtyping annotations), runs a
        # forward/backward pass and reloads a checkpoint. It used to be broken while the tests
        # stayed green.
        run: |
          # 1. fast dev run: full config path, one batch, no checkpoint written
          uv run --no-sync src/train.py debug=fdr
          # 2. a real (tiny) run so that `eval` has a checkpoint to restore
          uv run --no-sync src/train.py model_compile=false trainer.max_epochs=1 +trainer.limit_train_batches=0.02 +trainer.limit_val_batches=0.05
          uv run --no-sync src/eval.py model_compile=false ckpt_path="$PWD/checkpoints/last.ckpt" +trainer.limit_test_batches=0.05
