name: Unit Testing 🧪

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # the configs resolve ${oc.env:PROJECT_ROOT} for all the project paths
      PROJECT_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout your repo 📦
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # NB: do NOT pin an old version here: this project uses `[tool.uv] conflicts` and
          # per-extra `[tool.uv.sources]`, which uv < 0.5 cannot even parse.
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync project dependencies
        run: uv sync --locked --extra cpu --extra test

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Smoke test - train and evaluate one batch on CPU
        # This is what actually proves the template works: it resolves the hydra configs,
        # instantiates the datamodule/model (torchvision import, torchtyping annotations) and
        # runs a forward/backward pass. It used to be broken while the tests stayed green.
        run: |
          uv run --no-sync src/train.py debug=fdr
          uv run --no-sync src/eval.py debug=fdr ckpt_path="$(pwd)/checkpoints/last.ckpt"
