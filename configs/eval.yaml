# @package _global_

defaults:
  - _self_
  - data: mnist # choose datamodule with `test_dataloader()` for evaluation
  - model: mnist
  - callbacks: default # the callbacks used to create the checkpoint must be present when loading it
  - logger: null
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default

  # debugging config (enable through command line, e.g. `python eval.py debug=default)`)
  - debug: null

task_name: "eval"

tags: ["dev"]

# passing checkpoint path is necessary for evaluation
ckpt_path: ???

# Whether or not call torch.compile(model)
model_compile: True
