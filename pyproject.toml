[project]
name = "project-template"
version = "0.1.0"
description = "A template for machine learning projects: Lightning + Hydra + uv"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cloudpathlib>=0.19.0",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "kaggle>=1.6.17",
  "lightning>=2.4.0",
  "neptune>=1.12.0",
  "polars>=1.9.0",
  "rich>=13.9.2",
  "wandb>=0.18.3",
  "pandas>=2.2.3",
  "litserve>=0.2.3",
  "typeguard>=2.13.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3.3"]
docs = [
  "mkdocs-autorefs==1.2.0",
  "mkdocs-gen-files==0.5.0",
  "mkdocs-get-deps==0.2.0",
  "mkdocs-material-extensions==1.3.1",
  "mkdocs-material==9.5.41",
  "mkdocs-mermaid2-plugin==1.1.1",
  "mkdocs==1.6.1",
  "mkdocstrings-python==1.12.1",
  "mkdocstrings==0.26.2",
  "pymdown-extensions==10.11.2",
  "mkdocs-same-dir>=0.1.3",
]
lint = [
  "pre-commit>=4.0.1",
  "mypy>=1.14.1",
  "pandas-stubs>=2.2.3.241126",
  "types-pyyaml>=6.0.12.20241230",
  "types-regex>=2024.11.6.20241221",
  "types-requests>=2.31.0.6",
  "types-tqdm>=4.67.0.20241221",
]
# torch is capped below 2.7 on purpose: torchtyping 0.1.5 (unmaintained since 2022) relies on
# `Tensor.names`, which newer torch versions no longer expose, so every `@typechecked` tensor
# annotation raises `AttributeError: 'Tensor' object has no attribute 'names'`.
# Drop the cap (or drop torchtyping) once the tensor typing is migrated to jaxtyping/shapeguard.
cpu = ["torch>=2.5,<2.7", "torchtyping>=0.1.5", "torchvision>=0.20.1"]
gpu = ["torch>=2.5,<2.7", "torchtyping>=0.1.5", "torchvision>=0.20.1"]

[dependency-groups]
dev = ["pytest>=8.3.3"]

[tool.uv]
package = true # installs the project itself, so `import src...` works from anywhere (scripts, tests, docker)

# The `cpu` and `gpu` extras cannot be resolved together (torch comes from a different index),
# so uv resolves them independently.
conflicts = [
  [{ extra = "gpu" }, { extra = "cpu" }],
]

[[tool.uv.index]]
name = "pytorch-cuda11"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda11", extra = "gpu" },

  { index = "pytorch-cpu", extra = "cpu" },
]
# torchvision must come from the *same* index as torch: the PyPI wheels are built against a
# different CUDA runtime than the cu118 ones, and mixing them fails at import time with
# `RuntimeError: operator torchvision::nms does not exist`.
torchvision = [
  { index = "pytorch-cuda11", extra = "gpu" },

  { index = "pytorch-cpu", extra = "cpu" },
]


[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


[tool.mypy]
python_version = "3.12"
#mypy_path = ""
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
allow_redefinition = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
strict_optional = true
strict_equality = true
explicit_package_bases = true
follow_imports = "normal"
ignore_missing_imports = false


# Explicitly disable type checking on problematic modules
[[tool.mypy.overrides]]
module = [
  "cloudpathlib.*", # AnyPath is not properly typed

]
follow_imports = "skip"
ignore_missing_imports = true

# Explicitly ignore modules that don’t have type stubs
[[tool.mypy.overrides]]
module = [
  "torch_xla.*",
  "matplotlib.*",
  "scipy.*",
  "networkx.*",
  "seaborn.*",
  "neptune.*",
  "google.cloud.*",
  "sklearn.*",
  "tensorboard.*",
  "tensorboardX.*",
  "torchvision.*",
  "pydot.*",
  "joblib.*",
  "tokenizers.*",
  "transformers.*",
  "wandb.*",
  "litserve.*",
  "kaggle.*",
  "torchtyping.*",
]
ignore_missing_imports = true
